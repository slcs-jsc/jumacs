reference_period:
  start_year: 1985
  end_year: 2014
  nominal_reference_year: 2000
  meaning: 30-year monthly zonal reference climatology
  bias_correction: none
  trend_correction: none

# One project-wide pressure coordinate for application products. Individual
# climatologies compute statistics on native model levels; the application
# builder remaps those statistics onto this shared axis afterward.
#
# Only the endpoints and the target resolution are configured; config.vertical_grid()
# derives the levels, so there is one definition and no long list to keep in step.
#
# The grid is uniform in log10(pressure) with about sixteen intervals per decade,
# so adjacent levels differ by a constant factor of about 0.866 and the level count
# follows from the span instead of being written down: 1e5 Pa to 0.002 Pa covers
# 7.70 decades, which gives 123 intervals and 124 levels, or 15.98 per decade.
# Logarithmic spacing is the appropriate choice because pressure spans nearly eight
# decades from the surface to the model top, and a constant relative spacing keeps
# the resolution meaningful across that range. At a representative atmospheric scale
# height of about 7 km that step is close to 1 km of altitude, which preserves the
# vertical structure that JURASSIC radiative transfer/retrieval and MPTRAC
# transport/chemistry applications need while 124 levels remain modest in compute
# and storage for monthly zonal climatologies. It is a common application grid, not
# a claim that every atmospheric layer is fully resolved; native structure stays in
# the individual climatologies and monthly zonal intermediates.
#
# The top level is 0.002 Pa, roughly 120 km in a standard atmosphere. Pressure is
# authoritative: the equivalent altitude varies with temperature, latitude and
# season, so no altitude is configured and none is written into the products.
# Change max_pressure_pa, min_pressure_pa or intervals_per_decade and rebuild the
# application products. Individual climatologies keep their native axes.
vertical_grid:
  coordinate: pressure
  units: Pa
  interpolation: linear_log_pressure
  extrapolation: none
  max_pressure_pa: 100000.0
  min_pressure_pa: 0.002
  intervals_per_decade: 16
  description: log-uniform grid, about sixteen levels per decade (factor 10**0.0626), 1e5 Pa (surface) to 0.002 Pa (about 120 km)

# Vertical transition width for the CCMI + WACCM-X application product. Widths are
# counted in common-grid levels rather than kilometres, so they keep their meaning
# when the pressure grid changes: 12 levels span 11 intervals, about 11 km on the
# ~1 km grid. Per-variable overrides stay empty until a variable needs one.
extension:
  transition_levels: 12
  transition_levels_by_variable: {}

# Diagnostics only: the coverage matrix never changes products or interpolation.
coverage:
  # Descriptive label only: a field usable on at least this fraction of the common-grid pressure
  # levels is called broadly usable. It is not a condition for overlap or for extension by WACCM-X.
  usable_level_fraction: 0.5
  # A pressure level is usable where at least this fraction of its months and latitudes are finite.
  # This is the threshold behind the usable ranges, the overlap, and the extension decision. The reported
  # lower extent is any-finite instead (max_valid_pressure_pa), so terrain does not hide 1000 hPa.
  usable_sample_fraction: 0.9
  # Species given their own table in the Markdown summary, in priority order. Every other species a
  # product holds is still analyzed and listed in the CSV and JSON.
  # Canonical species names from config/species.yaml; NO is quoted because YAML reads bare no/NO as a boolean.
  application_focus: [O3, temperature, H2O, 'NO', NO2, HNO3, N2O, CH4, ClO, Cl2O2, Cly, Bry, NOy]
