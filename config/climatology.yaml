reference_period:
  start_year: 1985
  end_year: 2014
  nominal_reference_year: 2000
  meaning: 30-year monthly zonal reference climatology
  bias_correction: none
  trend_correction: none

# One project-wide pressure coordinate for every climatology product. Monthly
# zonal fields are regridded onto these levels before the statistics are
# computed, so all species and models share one vertical axis.
#
# The grid is uniform in log10(pressure) with ten levels per decade, so adjacent
# levels differ by a factor of 10**0.1 (about 1.26). Logarithmic spacing is the
# appropriate choice because pressure spans ten decades from the surface to the
# lower thermosphere, and a constant relative spacing keeps the resolution
# meaningful across that range. At a representative atmospheric scale height of
# about 7 km the 1.26 pressure ratio corresponds to roughly 1.6 km of vertical
# spacing, which preserves the vertical structure that JURASSIC radiative
# transfer/retrieval and MPTRAC transport/chemistry applications need while
# remaining modest in compute and storage for monthly zonal climatologies. It is
# a common application grid, not a claim that every atmospheric layer is fully
# resolved; native structure stays in the model-native zonal intermediates.
# Extend or coarsen the grid by editing this list only.
vertical_grid:
  coordinate: pressure
  units: Pa
  interpolation: linear_log_pressure
  extrapolation: none
  description: log-uniform grid, ten levels per decade (factor 10**0.1), 1e5 Pa (surface) to 1e-5 Pa (lower thermosphere)
