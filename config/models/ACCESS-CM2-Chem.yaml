# Verified live 2026-09-30 against CEDA: dataset record "CCMI-2022: REF-D1 data produced by the ACCESS-CM2-Chem model"
# (contact F. Dennison, published 2022-06-07, OGL v3). Additional members r2i1p1f1, r3i1p1f1 exist; this registry pins r1i1p1f1.
model:
  name: ACCESS-CM2-Chem
  display_name: ACCESS-CM2-Chem
  institution: CSIRO
  source_id: ACCESS-CM2-Chem
  kind: ccmi
  status: ready
  slug: access_cm2_chem_refd1
  archive_model: ACCESS-CM2-Chem
  experiment: refD1
  license: OGL v3
  verified: "2026-09-30"
  dataset_uuid: 031313dc6bfc4a0baabd58a51629bc21
  archive_base: https://data.ceda.ac.uk/badc/ccmi/data/post-cmip6/ccmi-2022/CSIRO/ACCESS-CM2-Chem/refD1/r1i1p1f1
capabilities:
  archive_inventory: true
  download: true
  zonal_processing: true
  climatology: true
  compact_waccmx: false
paths: {raw: data/raw/ACCESS-CM2-Chem/refD1, zonal: data/processed/ACCESS-CM2-Chem/refD1, climatology: products/climatology/ACCESS-CM2-Chem}
coordinates: {latitude: lat, longitude: lon, level: plev, pressure: plev}
# All mapped 3D fields are published on AmonZ pressure levels (39 levels, 100000-3 Pa), so the pressure-level
# families are preferred and the Amon hybrid-height levels (z = a + b*orog, no orog/ps in the files) are not used.
# c2h6 is the only mapped 3D exception: archived on Amon hybrid-height levels only, like the NIWA case, so it is
# omitted from the production climatology rather than reconstructed.
exclude_from_climatology: [c2h6]
variables:
  Br: br
  BrCl: brcl
  BrO: bro
  BrONO2: brono2
  Bry: bry
  C2H6: c2h6
  CFC-11: cfcl3
