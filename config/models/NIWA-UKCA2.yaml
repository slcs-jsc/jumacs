# Verified live 2026-09-30 against CEDA: dataset record "CCMI-2022: REF-D1 data produced by the NIWA-UKCA2 model at NIWA"
# (contact O. Morgenstern/G. Zeng, published 2021, OGL v3). Additional members r2i1p1f1, r3i1p1f1 exist; this registry pins r1i1p1f1.
model:
  name: NIWA-UKCA2
  display_name: NIWA-UKCA2
  institution: NIWA
  source_id: NIWA-UKCA2
  kind: ccmi
  status: ready
