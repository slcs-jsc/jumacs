capabilities:
  archive_inventory: true
  download: true
  zonal_processing: true
  climatology: true
  compact_waccmx: false
paths: {raw: data/raw/NIWA-UKCA2/refD1, zonal: data/processed/NIWA-UKCA2/refD1, climatology: products/climatology/NIWA-UKCA2}
