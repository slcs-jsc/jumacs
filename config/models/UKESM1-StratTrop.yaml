# Verified live 2026-09-30 against CEDA: dataset record "CCMI-2022: refD1 data produced by the UKESM1-StratTrop model
# at NCAS-CAMBRIDGE" (contact A. Abraham/A. Keeble, published 2023, OGL v3). Members use f2 (r1i1p1f2, r2i1p1f2, r3i1p1f2);
# this registry pins r1i1p1f2. Monthly file timestamps use YYYYMMDD-YYYYMMDD rather than the usual YYYYMM-YYYYMM.
model:
  name: UKESM1-StratTrop
  display_name: UKESM1-StratTrop
  institution: NCAS-CAMBRIDGE
