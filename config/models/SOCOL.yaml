# Verified live 2026-09-30 against CEDA: dataset record "CCMI-2022: refD1 data produced by the SOCOL model at ETH-PMOD"
# (contact E. Rozanov, published 2024-11-11, OGL v3). Non-standard layout: member directories are gn (contains Amon) and
# gnz (contains AmonZ), and the grid subdirectory below each variable is r1i1p1f1. archive_base lists both member
# directories (whitespace-separated) so inventory scans find Amon and AmonZ.
# Additional realizations r2i1p1f1 and r3i1p1f1 exist in the archive; this registry pins r1i1p1f1 (model.member).
