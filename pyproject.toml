[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jumacs"
version = "0.1.0"
description = "Jülich Multi-source Atmospheric Climatology System"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "xarray>=2023.1", "netCDF4>=1.6", "cftime>=1.6", "requests>=2.28", "beautifulsoup4>=4.11", "PyYAML>=6", "scipy>=1.9", "matplotlib>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
jumacs = "jumacs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "cache/pytest"
